worker_processes auto;
events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80;
        server_name _;

        # Unauthenticated browser → guest cookie. auth_request 401 on protected locations.
        error_page 401 = @guest_login;

        location @guest_login {
            return 302 $scheme://$http_host/api/auth/guest;
        }

        location = /auth/verify {
            internal;
            proxy_pass http://sidecar:8088/auth/verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-Forwarded-User "";
        }

        # Guest mint: sidecar, no auth_request (would loop).
        location /api/auth/guest {
            proxy_pass http://sidecar:8088;
            proxy_set_header Host $http_host;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-Forwarded-User "";
        }

        location /api/e2e {
            proxy_pass http://sidecar:8088;
            proxy_set_header Host $http_host;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-Forwarded-User "";
        }

        location /static/ {
            proxy_pass http://sidecar:8088;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-User "";
        }

        location /chat {
            auth_request /auth/verify;
            auth_request_set $auth_user $upstream_http_x_forwarded_user;
            proxy_pass http://sidecar:8088;
            proxy_set_header Host $http_host;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-Forwarded-User $auth_user;
        }

        location /submit {
            auth_request /auth/verify;
            auth_request_set $auth_user $upstream_http_x_forwarded_user;
            proxy_pass http://sidecar:8088;
            proxy_set_header Host $http_host;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-Forwarded-User $auth_user;
        }

        # Sidecar APIs only. Blanket /api/ would steal Grist's /api/docs.
        location /api/chat {
            auth_request /auth/verify;
            auth_request_set $auth_user $upstream_http_x_forwarded_user;
            proxy_pass http://sidecar:8088;
            proxy_set_header Host $http_host;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-Forwarded-User $auth_user;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_buffering off;
            proxy_cache off;
        }

        location /api/submit {
            auth_request /auth/verify;
            auth_request_set $auth_user $upstream_http_x_forwarded_user;
            proxy_pass http://sidecar:8088;
            proxy_set_header Host $http_host;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-Forwarded-User $auth_user;
        }

        location /api/grist {
            auth_request /auth/verify;
            auth_request_set $auth_user $upstream_http_x_forwarded_user;
            proxy_pass http://sidecar:8088;
            proxy_set_header Host $http_host;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-Forwarded-User $auth_user;
        }

        location /api/sql {
            auth_request /auth/verify;
            auth_request_set $auth_user $upstream_http_x_forwarded_user;
            proxy_pass http://sidecar:8088;
            proxy_set_header Host $http_host;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-Forwarded-User $auth_user;
        }

        location /api/models {
            auth_request /auth/verify;
            auth_request_set $auth_user $upstream_http_x_forwarded_user;
            proxy_pass http://sidecar:8088;
            proxy_set_header Host $http_host;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-Forwarded-User $auth_user;
        }

        location /api/upload {
            auth_request /auth/verify;
            auth_request_set $auth_user $upstream_http_x_forwarded_user;
            proxy_pass http://sidecar:8088;
            proxy_set_header Host $http_host;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-Forwarded-User $auth_user;
            proxy_read_timeout 180s;
            proxy_send_timeout 180s;
        }

        location / {
            auth_request /auth/verify;
            auth_request_set $auth_user $upstream_http_x_forwarded_user;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_pass http://grist:8484;
            proxy_set_header Host $http_host;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-User $auth_user;
            # ponytail: Grist has no page-template hook (official is Duplicate page). Inject Chat onto new pages.
            proxy_set_header Accept-Encoding "";
            sub_filter '</head>' '<script id="sih-ensure-chat" src="/static/ensure-chat.js"></script></head>';
            sub_filter_once on;
        }
    }
}
