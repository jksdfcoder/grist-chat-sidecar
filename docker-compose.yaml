name: sih-ver2

services:
  sidecar:
    build:
      context: ./sidecar
    env_file:
      - path: .env
        required: false
    environment:
      SIH_REQUIRE_ROLES: ${SIH_REQUIRE_ROLES:-false}
      SIH_SECRET_KEY: ${SIH_SECRET_KEY:-dev-secret-change-me-32chars!!}
      SIH_E2E: ${SIH_E2E:-false}
      SIH_SQLITE_PATH: /data/sidecar.sqlite
    volumes:
      - sidecar-data:/data
      - ./sidecar/app:/app/app
      - ./sidecar/static:/app/static
      - ./sidecar/templates:/app/templates
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8088", "--reload"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8088"
    networks:
      - edge

  grist:
    image: gristlabs/grist
    environment:
      GRIST_FORWARD_AUTH_HEADER: X-Forwarded-User
      GRIST_IGNORE_SESSION: "true"
      GRIST_IN_SERVICE: "true"
      APP_HOME_URL: ${APP_HOME_URL:-http://127.0.0.1:18080}
    volumes:
      - grist-data:/persist
    expose:
      - "8484"
    networks:
      - sheets

  proxy:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "18080:80"
    depends_on:
      - sidecar
      - grist
    networks:
      - edge
      - sheets

volumes:
  grist-data: {}
  sidecar-data: {}

networks:
  edge:
  sheets:
    internal: true
